mode: ContinuousDelivery
next-version: 0.1.0-beta.16
branches:
  master:
    regex: ^master$
    mode: ContinuousDelivery
    label: ""
  main:
    regex: ^main$
    mode: ContinuousDelivery
    label: ""
  develop:
    regex: ^develop$
    mode: ContinuousDelivery
    label: "beta"
  feature:
    regex: ^feature?[/-]
    mode: ContinuousDelivery
    label: "{BranchName}"
    increment: Inherit
    source-branches: ["master", "main", "develop"]
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDelivery
    increment: Inherit
