## NOTE: All top-level keys must use PascalCase (e.g., TemplateTypes, UniversalFields, TypeMapping, ReservedTags)
# This is required for C# deserialization; keys are case-sensitive and must match property names in MetadataSchemaConfig.
# Metadata Schema for Notebook Automation
# This file defines all template-types, type mappings, required fields, and reserved tags for metadata automation.

TemplateTypes:
  # Base template types provide default configurations for inheritance
  base-template:
    Type: note/base
    Prompt: default_prompt
    PathResolution:
      InputRoot: onedrive
      OutputRoot: vault
    Fields:
      publisher:
        Default: University of Illinois at Urbana-Champaign
      date-created:
        Resolver: DateCreatedResolver
      tags:
        Default: []
      auto-generated-state:
        Default: writable

  base-generic:
    Type: note/generic
    Prompt: generic_prompt
    PathResolution:
      InputRoot: cwd
      OutputRoot: input
    Fields:
      title:
        Default: ''
      date-created:
        Resolver: DateCreatedResolver
      source-url:
        Default: ''
      tags:
        Default: [generic]
      auto-generated-state:
        Default: writable

  # MBA-specific template types
  pdf-reference:
    BaseTypes:
      - base-template
      - universal-fields
    Type: note/case-study
    Prompt: pdf-reference
    RequiredFields:
      - comprehension
      - status
      - completion-date
      - authors
      - tags
    Fields:
      publisher:
        Default: University of Illinois at Urbana-Champaign
      status:
        Default: unread
      comprehension:
        Default: 0
      date-created:
        Resolver: DateCreatedResolver
      program:
        Resolver: ProgramResolver
      course:
        Resolver: CourseResolver
      class:
        Resolver: ClassResolver
      module:
        Resolver: ModuleResolver
      lesson:
        Resolver: LessonResolver
      title:
        Resolver: TitleResolver
      tags:
        Default: [pdf, reference]
      page-count:
        Resolver: PdfPageCountResolver
      pdf-onedrive-relative-path:
        Resolver: OneDriveRelativePathResolver
      pdftext-onedrive-relative-path:
        Resolver: OneDriveRelativePathResolver
      share-link:
        Resolver: OneDriveShareLinkResolver
      auto-generated-state:
        Default: writable
  video-reference:
    BaseTypes:
      - base-template
      - universal-fields
    Type: note/video-note
    Prompt: video-reference
    RequiredFields:
      - comprehension
      - status
      - video-duration
      - author
      - tags
    Fields:
      publisher:
        Default: University of Illinois at Urbana-Champaign
      status:
        Default: unwatched
      comprehension:
        Default: 0
      date-created:
        Resolver: DateCreatedResolver
      program:
        Resolver: ProgramResolver
      course:
        Resolver: CourseResolver
      class:
        Resolver: ClassResolver
      module:
        Resolver: ModuleResolver
      lesson:
        Resolver: LessonResolver
      title:
        Resolver: TitleResolver
      tags:
        Default: [video, reference]
      video-onedrive-relative-path:
        Resolver: OneDriveRelativePathResolver
      transcript-onedrive-relative-path:
        Resolver: OneDriveRelativePathResolver
      video-duration:
        Resolver: VideoDurationResolver
      share-link:
        Resolver: OneDriveShareLinkResolver
      auto-generated-state:
        Default: writable
  video_transcript_consolidation:
    BaseTypes:
      - universal-fields
    Type: note/video-transcript
    RequiredFields:
      - status
      - tags
      - auto-generated-state
      - video-onedrive-relative-path
    Fields:
      status:
        Default: compiled
      tags:
        Default: [transcript, consolidated]
      date-created:
        Resolver: DateCreatedResolver
      program:
        Resolver: ProgramResolver
      course:
        Resolver: CourseResolver
      class:
        Resolver: ClassResolver
      module:
        Resolver: ModuleResolver
      lesson:
        Resolver: LessonResolver
      title:
        Resolver: TitleResolver
      video-onedrive-relative-path:
        Resolver: VideoSourcesResolver
      share-link:
        Resolver: OneDriveShareLinkResolver
      auto-generated-state:
        Default: writable
  resource-reading:
    BaseTypes:
      - universal-fields
    Type: note/reading
    RequiredFields:
      - comprehension
      - status
      - page-count
      - authors
      - tags
    Fields:
      publisher:
        Default: University of Illinois at Urbana-Champaign
      status:
        Default: unread
      comprehension:
        Default: 0
      date-created:
        Resolver: DateCreatedResolver
      program:
        Resolver: ProgramResolver
      course:
        Resolver: CourseResolver
      class:
        Resolver: ClassResolver
      module:
        Resolver: ModuleResolver
      lesson:
        Resolver: LessonResolver
      title:
        Resolver: TitleResolver
      tags:
        Default: []
      page-count:
        Resolver: PdfPageCountResolver
      share-link:
        Resolver: OneDriveShareLinkResolver
      auto-generated-state:
        Default: writable
  note/instruction:
    BaseTypes:
      - universal-fields
    Type: note/instruction
    RequiredFields:
      - tags

  # Generic template types for ad-hoc content processing
  generic-video:
    BaseTypes:
      - base-generic
    Type: note/video
    Fields:
      channel:
        Default: ''
      video-duration:
        Default: ''

  generic-pdf:
    BaseTypes:
      - base-generic
    Type: note/document
    Fields:
      author:
        Default: ''
      page-count:
        Default: 0

UniversalFields:
  - auto-generated-state
  - date-created
  - publisher
TypeMapping:
  pdf-reference: note/case-study
  video-reference: note/video-note
  video_transcript_consolidation: note/video-transcript
  resource-reading: note/reading
  note/instruction: note/instruction
  generic-video: note/video
  generic-pdf: note/document
ReservedTags:
  # Reserved tags cannot be used as custom tags and must be present as fields in all templates
  - auto-generated-state
  - date-created
  - publisher
  - tags
